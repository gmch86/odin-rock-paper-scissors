<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="disabled-ui-container">
      <label for="ui"
        >UI <input type="checkbox" id="ui" name="ui" checked
      /></label>
      <button type="button" class="play-btn">New Game</button>
    </div>
    <div class="enabled-ui-container">
      <button type="button" class="reset-btn">Reset Game</button>
      <div class="choice-btns">
        <button type="button" class="choice-btn rock" value="rock">Rock</button>
        <button type="button" class="choice-btn paper" value="paper">
          Paper
        </button>
        <button type="button" class="choice-btn scissors" value="scissors">
          Scissors
        </button>
      </div>
      <button type="button" class="battle-btn">Battle</button>
      <span class="round-display">Round: </span>
      <span class="human-score">Human score:</span>
      <span class="computer-score">Computer score:</span>
    </div>
  </body>
</html>
